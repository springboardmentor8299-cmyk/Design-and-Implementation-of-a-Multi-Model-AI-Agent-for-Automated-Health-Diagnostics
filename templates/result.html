<!DOCTYPE html>
<html>

<head>

<title>Health Analysis Result</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f7fb;
}

.card{
border-radius:15px;
box-shadow:0px 4px 10px rgba(0,0,0,0.1);
}

.high{
background:#ff4d4d;
color:white;
}

.medium{
background:#ffc107;
}

.low{
background:#28a745;
color:white;
}

</style>

</head>

<body>

<div class="container mt-4">

<h1 class="text-center mb-4">Health Report Dashboard</h1>

<div class="text-center mb-4">

<h3>Overall Risk Level</h3>

<h2 class="text-danger">{{risk}}</h2>

</div>

<div class="row">

{% for param in parameters %}

<div class="col-md-4">

<div class="card p-3 mb-3

{% if param.status == 'High' %}
high
{% elif param.status == 'Medium' %}
medium
{% else %}
low
{% endif %}

">

<h5>{{param.name}}</h5>

<p>Value: {{param.value}}</p>

<p>Status: {{param.status}}</p>

</div>

</div>

{% endfor %}

</div>

<div class="row mt-4">

<div class="col-md-6">

<div class="card p-3">

<h4>Health Parameter Chart</h4>

<img src="{{chart}}" width="100%">

</div>

</div>

<div class="col-md-6">

<div class="card p-3">

<h4>AI Explanation</h4>

<ul>

{% for e in explanation %}

<li>{{e}}</li>

{% endfor %}

</ul>

</div>

</div>

</div>

<div class="text-center mt-4">

<a href="{{pdf}}" class="btn btn-success btn-lg">
Download Health Report PDF
</a>

</div>

</div>

</body>

</html>
