<!DOCTYPE html>
<html>
<head>
<title>Health AI</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

/* 🌈 BACKGROUND */
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
color:white;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
}

nav a{
color:white;
margin:0 10px;
text-decoration:none;
}

/* HERO */
.hero{
display:flex;
justify-content:space-between;
align-items:center;
padding:50px;
flex-wrap:wrap;
}

/* LEFT TEXT */
.hero-text{
max-width:500px;
}

.hero-text h1{
font-size:36px;
}

.hero-text p{
color:#e5e7eb;
}

/* FORM */
.form-box{
background:rgba(255,255,255,0.1);
backdrop-filter:blur(15px);
padding:25px;
border-radius:15px;
width:350px;
box-shadow:0 8px 25px rgba(0,0,0,0.3);
}

.form-box input,
.form-box select{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:none;
}

.form-box button{
width:100%;
padding:12px;
background:#38bdf8;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

/* LOADER */
.loader{
display:none;
text-align:center;
margin-top:15px;
}

.spinner{
width:40px;
height:40px;
border:5px solid #ccc;
border-top:5px solid #38bdf8;
border-radius:50%;
animation:spin 1s linear infinite;
margin:auto;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

</style>
</head>

<body>

<header>
<h2>🧠 HEALTH AI</h2>

<nav>
<a href="/">Home</a>
<a href="/history">History</a>
<a href="/logout">Logout</a>
</nav>
</header>

<section class="hero">

<!-- LEFT -->
<div class="hero-text">
<h1>AI-Powered Health Analysis</h1>
<p>
Upload your blood report and get instant insights,
risk detection, and recommendations.
</p>
</div>

<!-- RIGHT FORM -->
<div class="form-box">

<h3>Upload Report</h3>

<form action="/analyze" method="POST" enctype="multipart/form-data" onsubmit="showLoader()">

<input type="text" name="patient_name" placeholder="Patient Name" required>

<input type="file" name="file" required>

<input type="number" name="age" placeholder="Age" required>

<select name="gender" required>
<option value="">Select Gender</option>
<option value="male">Male</option>
<option value="female">Female</option>
</select>

<select name="exercise">
<option value="">Exercise</option>
<option value="yes">Yes</option>
<option value="no">No</option>
</select>

<select name="smoking">
<option value="">Smoking</option>
<option value="yes">Yes</option>
<option value="no">No</option>
</select>

<select name="sleep">
<option value="">Sleep Quality</option>
<option value="good">Good</option>
<option value="poor">Poor</option>
</select>

<button type="submit">Analyze Report 🚀</button>

</form>

<!-- LOADER -->
<div id="loader" class="loader">
<p>🤖 AI is analyzing your report...</p>
<div class="spinner"></div>
</div>

</div>

</section>

<script>
function showLoader(){
document.getElementById("loader").style.display = "block";
}
</script>

</body>
</html>
